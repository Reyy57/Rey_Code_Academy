<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Chat | Rey Code Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid #30363d; }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div class="glass p-6 rounded-2xl w-full max-w-sm">
        <h2 class="text-center font-bold text-blue-400 mb-6">PORTAL CHAT</h2>

        <div id="login-form" class="space-y-3">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 bg-black border border-slate-700 rounded-xl text-xs">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 bg-black border border-slate-700 rounded-xl text-xs">
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-login" class="bg-blue-600 p-2 rounded-lg text-xs">LOGIN</button>
                <button id="btn-register" class="bg-green-700 p-2 rounded-lg text-xs">DAFTAR</button>
            </div>
        </div>

        <div id="member-area" style="display: none;" class="space-y-4">
            <div id="list-container" class="h-48 overflow-y-auto p-2 bg-black border border-slate-700 rounded-lg text-xs"></div>
            <input type="text" id="input-data" placeholder="Ketik pesan..." class="w-full p-2 bg-black border border-slate-700 rounded-lg text-xs">
            <button id="btn-add" class="w-full bg-blue-600 p-2 rounded-lg text-xs">KIRIM</button>
            <button id="btn-logout" class="w-full bg-red-900 p-2 rounded-lg text-xs">LOGOUT</button>
        </div>
        
        <a href="index.html" class="block text-center text-[10px] text-slate-500 mt-6 underline">← Kembali ke Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWxhWyiu9JLBsVzkHjE-x4UcSsMUzp8cI",
            authDomain: "rey-code-academy.firebaseapp.com",
            projectId: "rey-code-academy",
            storageBucket: "rey-code-academy.firebasestorage.app",
            messagingSenderId: "777024739059",
            appId: "1:777024739059:web:440f7a64ddf5bc7017c986"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("btn-login").onclick = () => signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value).catch(e => alert(e.message));
        document.getElementById("btn-register").onclick = () => createUserWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value).catch(e => alert(e.message));
        document.getElementById("btn-logout").onclick = () => signOut(auth);
        document.getElementById("btn-add").onclick = async () => {
            const val = document.getElementById("input-data").value;
            if(val) {
                await addDoc(collection(db, "chat"), { teks: val, email: auth.currentUser.email, date: serverTimestamp() });
                document.getElementById("input-data").value = "";
            }
        };

        onAuthStateChanged(auth, (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
            if(user) {
                const q = query(collection(db, "chat"), orderBy("date", "asc"));
                onSnapshot(q, (snapshot) => {
                    const list = document.getElementById("list-container");
                    list.innerHTML = "";
                    snapshot.forEach(d => {
                        const data = d.data();
                        list.innerHTML += `<div class="mb-1"><b class="text-blue-400">${data.email.split('@')[0]}:</b> ${data.teks}</div>`;
                    });
                    list.scrollTop = list.scrollHeight;
                });
            }
        });
    </script>
</body>
</html>
