<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 95%; padding: 10px; margin-top: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-form">
            <h2>Login Academy</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="btn-login">Login</button>
        </div>

        <div id="member-area" style="display: none;">
            <h2>Halo Member!</h2>
            <p>Selamat datang di dashboard lo.</p>
            <button id="btn-logout" style="background: #dc3545;">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWxhWyiu9JLBsVzkHjE-x4UcSsMUzp8cI",
            authDomain: "rey-code-academy.firebaseapp.com",
            projectId: "rey-code-academy",
            storageBucket: "rey-code-academy.firebasestorage.app",
            messagingSenderId: "777024739059",
            appId: "1:777024739059:web:440f7a64ddf5bc7017c986"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("btn-login").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, email, pass).catch((e) => alert("Error: " + e.message));
        });

        document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
        });
    </script>
</body>
</html>
