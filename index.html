<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dark-mode { background-color: #0f172a; }
        .dark-card { background-color: #1e293b !important; color: white !important; }
        .dark-input { background-color: #334155 !important; color: white !important; border: none !important; }
    </style>
</head>
<body id="body" class="bg-slate-100 min-h-screen flex items-center justify-center p-4 transition-all">

    <div id="card" class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm transition-all">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-black italic">REY CODE</h1>
            <button id="btn-toggle" class="text-[10px] bg-slate-200 px-2 py-1 rounded-full dark:bg-slate-700">MODE</button>
        </div>

        <div id="login-form" class="space-y-3">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-xl dark-input">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-xl dark-input">
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-login" class="bg-blue-600 text-white font-bold py-3 rounded-xl text-xs">LOGIN</button>
                <button id="btn-register" class="bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">DAFTAR</button>
            </div>
        </div>

        <div id="member-area" style="display: none;" class="space-y-4">
            <div id="list-container" class="space-y-3 h-64 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-900 rounded-lg border dark:border-slate-700"></div>
            
            <div class="border-t pt-4 dark:border-slate-700">
                <input type="text" id="input-data" placeholder="Ketik pesan..." class="w-full p-2 border rounded-lg text-sm mb-2 dark-input">
                <button id="btn-add" class="w-full bg-blue-500 text-white py-2 rounded-lg text-sm font-bold">KIRIM PESAN</button>
            </div>
            
            <div class="border-t pt-2 space-y-1 dark:border-slate-700">
                <input type="password" id="new-password" placeholder="Password baru..." class="w-full p-2 border rounded-lg text-xs dark-input">
                <button id="btn-update-pass" class="w-full bg-slate-700 text-white py-1 rounded-lg text-xs">GANTI PASSWORD</button>
                <button id="btn-logout" class="w-full bg-rose-500 text-white py-1 rounded-lg text-xs">LOGOUT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWxhWyiu9JLBsVzkHjE-x4UcSsMUzp8cI",
            authDomain: "rey-code-academy.firebaseapp.com",
            projectId: "rey-code-academy",
            storageBucket: "rey-code-academy.firebasestorage.app",
            messagingSenderId: "777024739059",
            appId: "1:777024739059:web:440f7a64ddf5bc7017c986"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const adminEmail = "rey@gmail.com";

        // Dark Mode Logic
        document.getElementById("btn-toggle").onclick = () => {
            document.getElementById("body").classList.toggle("dark-mode");
            document.getElementById("card").classList.toggle("dark-card");
        };

        // Bot Logic
        async function runBot(teks) {
            let reply = "";
            if (teks === "/halo") reply = "Halo, Rey Code Academy siap melayani!";
            if (teks === "/waktu") reply = "Sekarang jam " + new Date().toLocaleTimeString();
            if (reply) await addDoc(collection(db, "chat"), { teks: "[BOT]: " + reply, email: "bot@academy.com", date: serverTimestamp() });
        }

        // Add Data
        document.getElementById("btn-add").addEventListener("click", async () => {
            const input = document.getElementById("input-data");
            if(input.value) {
                await addDoc(collection(db, "chat"), { teks: input.value, email: auth.currentUser.email, date: serverTimestamp() });
                runBot(input.value);
                input.value = "";
            }
        });

        // Auth Logic
        document.getElementById("btn-login").onclick = async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value); }
            catch(e) { alert(e.message); }
        };

        document.getElementById("btn-register").onclick = async () => {
            try { await createUserWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value); alert("Akun berhasil dibuat!"); }
            catch(e) { alert(e.message); }
        };

        window.hapusData = async (id) => { if(confirm("Hapus pesan?")) await deleteDoc(doc(db, "chat", id)); };

        onAuthStateChanged(auth, (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
            if(user) {
                const q = query(collection(db, "chat"), orderBy("date", "asc"));
                onSnapshot(q, (snapshot) => {
                    const list = document.getElementById("list-container");
                    list.innerHTML = "";
                    snapshot.forEach(d => {
                        const data = d.data();
                        const isMe = data.email === user.email;
                        const div = document.createElement("div");
                        div.className = `p-2 rounded-lg text-xs border max-w-[80%] ${isMe ? 'bg-blue-100 ml-auto' : 'bg-white dark:bg-slate-700 dark:border-none'}`;
                        div.innerHTML = `<p class="font-bold text-[9px] text-gray-500">${data.email}</p><p>${data.teks}</p>${user.email === adminEmail ? `<button onclick="hapusData('${d.id}')" class="text-rose-400 font-bold">X</button>` : ''}`;
                        list.appendChild(div);
                    });
                    list.scrollTop = list.scrollHeight;
                });
            }
        });

        document.getElementById("btn-update-pass").onclick = async () => {
            const p = document.getElementById("new-password").value;
            if(p.length < 6) return alert("Min 6 karakter!");
            try { await updatePassword(auth.currentUser, p); alert("Password diganti!"); } catch(e) { alert(e.message); }
        };

        document.getElementById("btn-logout").onclick = () => signOut(auth);
    </script>
</body>
</html>
