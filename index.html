        .container { max-width: 800px; margin: auto; padding: 30px 20px; }

        .status-bar { font-size: 0.7em; color: #58a6ff; letter-spacing: 5px; margin-top: 10px; border-top: 1px solid #30363d; border-bottom: 1px solid #30363d; padding: 5px 0; }

        .story-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); padding: 25px; border-radius: 20px; border: 1px solid rgba(88, 166, 255, 0.2); margin-bottom: 30px; }

        .card { background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(10px); border: 1px solid #30363d; padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: #58a6ff; box-shadow: 0 0 20px rgba(88, 166, 255, 0.2); transform: scale(1.01); }
        .card h3 { margin: 0 0 10px 0; font-size: 1.2em; color: #fff; }
        .tech-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .tag { font-size: 0.7em; background: #161b22; padding: 4px 10px; border-radius: 4px; color: #58a6ff; border: 1px solid #30363d; }

        /* Modal Lebih Padat */

        .modal-content { background: #0d1117; padding: 40px; border-radius: 20px; max-width: 600px; width: 85%; border: 1px solid #58a6ff; position: relative; max-height: 80vh; overflow-y: auto; }
        .modal-h2 { color: #58a6ff; border-bottom: 2px solid #30363d; padding-bottom: 10px; margin-top: 0; }
        .modal-desc { font-size: 0.95em; line-height: 1.8; color: #c9d1d9; }
        .btn-wa { background: #238636; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 30px; transition: 0.3s; }
        .btn-wa:hover { background: #2ea043; }
    </style>
</head>

        </div>

            <h3>📊 03. Data Science</h3>
            <div class="tech-tags"><span class="tag">Python</span><span class="tag">PyTorch</span><span class="tag">SQL</span><span class="tag">Pandas</span></div>
        </div>

        <div class="card" onclick="openDetail('Game Development', 'Materi Mendalam:\n\n1. Physics Engine: Custom collision algorithm, rigid body simulation, & Inverse Kinematics (IK).\n2. Graphics: Shader Graph/HLSL untuk visual effects & Post-processing.\n3. Network: Deterministic Networking, Netcode (Photon/Mirror), & Server-Authoritative architecture.\n4. Optimization: Asset batching, memory profiling, dan Level of Detail (LOD) management.', 'Unity, C#, Unreal Engine, C++, Blender')">

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mTitle" class="modal-h2"></h2>
        <p id="mDesc" class="modal-desc"></p>
        <button class="btn-wa" onclick="hubungiMentor()">Start Consultation</button>
    </div>
</div>

<script>
    const text = "Dulu, gue pikir memperbaiki hati itu sama kayak memperbaiki bug. Ternyata cinta jauh lebih rumit daripada syntax. Gue memilih untuk fokus membangun masa depan melalui kode. Selamat datang di tempat di mana logika menang atas perasaan.";
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 20);
        }
    }
    window.onload = typeWriter;

    function openDetail(title, desc, stack) {
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function hubungiMentor() { window.open("https://wa.me/628xxxxxxxxxx?text=Halo Rey, saya ingin diskusi lebih lanjut tentang " + document.getElementById('mTitle').innerText); }
</script>
