<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        
        <div id="login-form" class="space-y-4">
            <h2 class="text-2xl font-bold text-gray-800 text-center">Login Academy</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none">
            <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Login</button>
        </div>

        <div id="member-area" style="display: none;" class="space-y-4">
            <h2 class="text-xl font-bold text-gray-800">Halo, <span id="user-email" class="text-blue-600"></span>!</h2>
            <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                <p id="pesan-dari-admin" class="text-gray-700 font-medium italic"></p>
            </div>
            
            <div id="admin-tools" class="border-t pt-4 hidden">
                <input type="text" id="input-pesan" placeholder="Update pengumuman..." class="w-full p-2 border rounded-lg text-sm mb-2 outline-blue-400">
                <button id="btn-update" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 rounded-lg transition text-sm">Update Pesan</button>
            </div>
            
            <button id="btn-logout" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2 rounded-lg transition text-sm">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWxhWyiu9JLBsVzkHjE-x4UcSsMUzp8cI",
            authDomain: "rey-code-academy.firebaseapp.com",
            projectId: "rey-code-academy",
            storageBucket: "rey-code-academy.firebasestorage.app",
            messagingSenderId: "777024739059",
            appId: "1:777024739059:web:440f7a64ddf5bc7017c986"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const docId = "5dCeukL4hDZROHKnOUth"; 
        const adminEmail = "rey@gmail.com"; // GANTI EMAIL LO DI SINI

        document.getElementById("btn-login").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, email, pass).catch((e) => alert("Error: " + e.message));
        });

        document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

        document.getElementById("btn-update").addEventListener("click", async () => {
            const teksBaru = document.getElementById("input-pesan").value;
            if(teksBaru) {
                const docRef = doc(db, "pesan", docId);
                await updateDoc(docRef, { teks: teksBaru });
                document.getElementById("input-pesan").value = ""; 
            }
        });

        onAuthStateChanged(auth, async (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
            
            if(user) {
                document.getElementById("user-email").innerText = user.email;
                
                // Cek apakah user adalah admin
                if(user.email === adminEmail) {
                    document.getElementById("admin-tools").classList.remove("hidden");
                } else {
                    document.getElementById("admin-tools").classList.add("hidden");
                }
                
                // Realtime Listener
                const docRef = doc(db, "pesan", docId);
                onSnapshot(docRef, (doc) => {
                    if (doc.exists()) {
                        document.getElementById("pesan-dari-admin").innerText = doc.data().teks;
                    }
                });
            }
        });
    </script>
</body>
</html>
