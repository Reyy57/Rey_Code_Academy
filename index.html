        .story-box { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border: 1px solid rgba(88, 166, 255, 0.2); margin-bottom: 20px; }
        #typing-text { font-style: italic; line-height: 1.5; color: #c9d1d9; font-size: 0.85em; }

        .card { background: rgba(13, 17, 23, 0.5); backdrop-filter: blur(5px); border: 1px solid #30363d; padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #58a6ff; transform: scale(1.01); }
        .card h3 { margin: 0 0 5px 0; font-size: 1em; }
        .tech-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { font-size: 0.55em; background: #161b22; padding: 2px 6px; border-radius: 4px; color: #58a6ff; }

        /* Modal Dikecilin & Dibuat Compact */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1001; align-items: center; justify-content: center; padding: 10px; }
        .modal-content { background: #0d1117; padding: 20px; border-radius: 15px; max-width: 380px; width: 95%; border: 1px solid #58a6ff; position: relative; max-height: 70vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 5px; right: 10px; font-size: 20px; color: #58a6ff; cursor: pointer; }
        .modal-h2 { color: #58a6ff; margin-top: 0; font-size: 1.2em; }
        .modal-desc { line-height: 1.4; color: #c9d1d9; font-size: 0.8em; }
        .btn-wa { background: #238636; color: white; padding: 10px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 0.85em; }
    </style>
</head>
<body>

<div id="loader">LOADING...</div>
<video autoplay muted loop playsinline id="bg-video"><source src="VID_20250702_110744_839.mp4" type="video/mp4"></video>
<div class="overlay"></div>

<div class="container">
    <header>
        <h1>REY_CODE_ACADEMY</h1>
    </header>

    <div class="story-box">
        <p id="typing-text"></p>
    </div>

    <div style="display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px;">
        <div style="background: rgba(88, 166, 255, 0.1); padding: 10px; border-radius: 10px; width: 50%; text-align: center;">
            <h3 style="margin:0; font-size: 1em;">120+</h3>
            <p style="font-size: 0.6em; color: #8b949e;">Proyek Selesai</p>
        </div>
        <div style="background: rgba(88, 166, 255, 0.1); padding: 10px; border-radius: 10px; width: 50%; text-align: center;">
            <h3 style="margin:0; font-size: 1em;">24/7</h3>
            <p style="font-size: 0.6em; color: #8b949e;">Support Aktif</p>
        </div>
    </div>

    <div class="grid" id="menu-grid"></div>

    <div class="story-box" style="margin-top:20px;">
        <h3 style="font-size: 0.8em; margin: 0 0 10px 0;">Apa kata klien?</h3>
        <p style="font-size: 0.75em; color: #8b949e; font-style: italic;">"Web yang dibikin Rey rapi banget, performanya kenceng, dan adminnya fast response."</p>
        <small style="color: #58a6ff; font-size: 0.7em;">— Fajar, Client</small>
    </div>

    <footer style="text-align:center; margin-top:20px; color:#8b949e; font-size:0.7em;">
        Chat WhatsApp: <a href="https://wa.me/628xxxxxxxxxx" style="color:#58a6ff;">Klik di sini</a> | © 2026
    </footer>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="mTitle" class="modal-h2"></h2>
        <div id="mDesc" class="modal-desc"></div>
        <button class="btn-wa" onclick="hubungiMentor()">Start Consultation</button>
    </div>
</div>

<script>
    const modules = {
        "Web Development": { tags: ["Next.js", "Node.js"], desc: "1. <strong>Fondasi:</strong> HTML5, CSS3, JS ES6+.<br>2. <strong>Framework:</strong> React.js & Next.js.<br>3. <strong>Backend:</strong> Node.js, Express.<br>4. <strong>Database:</strong> PostgreSQL, MongoDB.<br>5. <strong>Cloud:</strong> Vercel/Netlify deployment." },
        "Mobile Development": { tags: ["Flutter", "Firebase"], desc: "1. <strong>UI/UX:</strong> Flutter, SwiftUI.<br>2. <strong>State Mgmt:</strong> BLoC/Riverpod.<br>3. <strong>Backend:</strong> Firebase (Auth, Firestore).<br>4. <strong>Optimasi:</strong> Memori & speed.<br>5. <strong>Distribusi:</strong> Play Store guidelines." },
        "Data Science": { tags: ["Python", "Pandas"], desc: "1. <strong>Pythonic:</strong> Numpy & Pandas.<br>2. <strong>Visualization:</strong> Seaborn & Plotly.<br>3. <strong>ML:</strong> Scikit-learn (Regresi/Klasifikasi).<br>4. <strong>Deep Learning:</strong> PyTorch.<br>5. <strong>MLOps:</strong> Docker & Model serving." },
        "Game Development": { tags: ["Unity", "C#"], desc: "1. <strong>Engine Core:</strong> Unity 3D.<br>2. <strong>Scripting:</strong> C# Fundamental.<br>3. <strong>Math:</strong> Vektor, Matrix, & Quaternions.<br>4. <strong>Physics:</strong> Collision & Raycasting.<br>5. <strong>Networking:</strong> Photon Multiplayer." },
        "UI/UX Design": { tags: ["Figma"], desc: "1. <strong>Design Thinking:</strong> Empathy, Ideate.<br>2. <strong>Wireframing:</strong> Lo-fi to Hi-fi.<br>3. <strong>System Design:</strong> Atomic Components.<br>4. <strong>Interaction:</strong> Advanced prototyping.<br>5. <strong>Accessibility:</strong> WCAG Standards." }
    };

    const grid = document.getElementById('menu-grid');
    for (let key in modules) {
        grid.innerHTML += `<div class="card" onclick="openDetail('${key}')"><h3>🚀 ${key}</h3><div class="tech-tags">${modules[key].tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></div>`;
    }

    window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000); });
    const text = "Di dunia digital, kode bukan cuma bahasa mesin—itu bahasa masa depan. Gue membangun Rey Code Academy buat bantu lo jadi kreator, bukan cuma konsumen. Mari bangun sesuatu yang luar biasa.";
    let i = 0;
    function typeWriter() {
        if (i < text.length) { document.getElementById("typing-text").innerHTML += text.charAt(i); i++; setTimeout(typeWriter, 20); }
    }
    window.onload = typeWriter;

    function openDetail(title) { document.getElementById('mTitle').innerText = title; document.getElementById('mDesc').innerHTML = modules[title].desc; document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function hubungiMentor() { window.open("https://wa.me/628xxxxxxxxxx?text=Halo Rey, saya ingin diskusi tentang jasa " + document.getElementById('mTitle').innerText); }
</script>
</body>
</html>
