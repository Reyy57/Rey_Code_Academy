<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Expert Roadmap</title>
    <style>
        :root { --bg: #000; --text: #fff; --accent: #58a6ff; --card-bg: rgba(255,255,255,0.03); --accent-glow: 0 0 10px #58a6ff, 0 0 20px #58a6ff; }
        .light-mode { --bg: #f0f2f5; --text: #000; --accent: #0969da; --card-bg: rgba(0,0,0,0.03); --accent-glow: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); transition: 0.3s; overflow-x: hidden; }
        .online-dot { width: 10px; height: 10px; background: #25D366; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 10px #25D366; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%); z-index: -1; }
        
        /* Fitur Baru */
        #breach-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: red; font-family: monospace; }
        #canvas-matrix { position: fixed; top:0; left:0; z-index: -3; opacity: 0.2; }
        #auto-save { position: fixed; top: 10px; right: 20px; font-size: 0.6em; color: var(--accent); font-family: 'Courier New', monospace; z-index: 100; }
        
        /* Loader & Komponen Asli */
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--accent); }
        #loading-text { font-family: 'Courier New', monospace; font-size: 1.2em; text-align: center; padding: 0 20px; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 70px; transition: 0.3s; }
        @media (min-width: 768px) { .container { max-width: 900px; } }
        header { display: flex; flex-direction: column; align-items: flex-start; margin: 25px 0; }
        .title-row { display: flex; align-items: center; width: 100%; }
        .animated-title-container { overflow: hidden; white-space: nowrap; flex-grow: 1; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animated-title { animation: marquee 10s linear infinite; font-size: 1.6em; letter-spacing: 2px; color: var(--accent); text-shadow: var(--accent-glow); margin: 0; }
        .story-box { background: var(--card-bg); backdrop-filter: blur(10px); padding: 18px; border-radius: 15px; margin-bottom: 18px; border: 1px solid rgba(88, 166, 255, 0.15); }
        #typing-text { font-style: italic; line-height: 1.5; font-size: 0.82em; color: rgba(255,255,255,0.75); }
        .section-title { color: var(--accent); margin: 40px 0 15px 0; font-size: 1.1em; border-left: 4px solid var(--accent); padding-left: 10px; }
        .service-grid-custom { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-bottom: 30px; }
        .service-card-custom { background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .service-card-custom:hover { border-color: var(--accent); transform: translateY(-5px); }
        .service-icon-custom { font-size: 1.5em; display: block; margin-bottom: 5px; }
        .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
        .card { background: rgba(13, 17, 23, 0.55); border: 1px solid #30363d; padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; color: #fff; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--accent); transform: scale(1.02); }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .card h3 { margin: 0; font-size: 0.95em; }
        .card-icon { font-size: 1.1em; color: var(--accent); }
        .toast { position: fixed; bottom: 15px; left: 15px; background: var(--accent); color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.65em; display: none; z-index: 1002; }
        .badge-grid { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; }
        .badge { background: #30363d; padding: 3px 7px; border-radius: 4px; font-size: 0.65em; white-space: nowrap; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .card-tags-badge { display: flex; gap: 4px; margin-top: 5px; }
        .card .badge { background: #161b22; color: var(--accent); border-color: #30363d; font-size: 0.6em; }
        .progress-bar { height: 7px; background: #30363d; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: var(--accent); width: 85%; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1001; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: var(--bg); padding: 18px; border-radius: 15px; max-width: 360px; width: 90%; border: 1px solid var(--accent); max-height: 65vh; overflow-y: auto; color: var(--text); }
        .close-modal-btn { position: absolute; top: 10px; right: 15px; color: var(--accent); cursor: pointer; font-size: 1.2em; }
        .btn-wa { background: #238636; color: white; padding: 11px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 13px; font-size: 0.85em; }
    </style>
</head>
<body>

<div id="breach-screen">
    <h1>ACCESS_DENIED</h1>
    <input type="password" id="auth-key" placeholder="Enter Authorization Key" style="background:#000; color:red; border:1px solid red; padding:10px;">
    <button onclick="checkAuth()" style="margin-top:10px; cursor:pointer;">AUTHORIZE</button>
</div>

<div id="auto-save">> [SYSTEM] Data synced: 98%</div>
<canvas id="canvas-matrix"></canvas>

<div id="loader">
    <div id="loading-text"></div>
    <div style="font-size: 0.6em; margin-top:10px; color: #58a6ff; letter-spacing: 2px;">REY_CODE_ACADEMY_SYSTEM</div>
</div>

<video autoplay muted loop playsinline id="bg-video"><source src="VID_20250702_110744_839.mp4" type="video/mp4"></video>
<div class="overlay"></div>

<div class="container">
    <header>
        <div class="title-row">
            <div class="animated-title-container">
                <h1 class="animated-title"><span class="online-dot"></span> REY_CODE_ACADEMY</h1>
            </div>
            <img src="ezgif.com-video-to-gif-converter.gif" alt="kucing" style="width: 45px; height: 45px; margin-left: 10px; border-radius: 50%; flex-shrink: 0;">
        </div>
        <div onclick="toggleTheme()" style="cursor:pointer; font-size: 0.7em; color:var(--accent); margin-top: 5px;">🌓 Ganti Mode</div>
    </header>

    <div class="story-box"><p id="typing-text"></p></div>
    </div>

<script>
    // Breach & Matrix Logic
    function checkAuth() { if(document.getElementById('auth-key').value === "rey57") document.getElementById('breach-screen').style.display = 'none'; else alert("WRONG KEY"); }
    const canvas = document.getElementById('canvas-matrix'); const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/20)).fill(1);
    function draw() { ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#0F0'; drops.forEach((y, i) => { ctx.fillText(Math.floor(Math.random()*2), i*20, y*20); if(y*20 > canvas.height) drops[i] = 0; drops[i]++; }); }
    setInterval(draw, 50);
    setInterval(() => document.getElementById('auto-save').innerText = `> [SYSTEM] Data synced: ${Math.floor(Math.random()*100)}%`, 3000);
    
    // Voice
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onresult = (e) => { if(e.results[0][0].transcript.includes("proyek")) window.scrollTo(0, 500); };
    rec.start();

    // Loader & Teks Utama (Perbaikan Kutip)
    const text = "Selamat datang di Rey Code Academy. Tempat di mana gue menukar air mata dengan logika. Gue pernah berada di titik terendah, dihancurkan oleh ekspektasi dan ditinggalkan oleh orang yang gue pikir bakal ada di sana selamanya. Perihnya masih kerasa, tapi gue nggak akan membiarkan itu jadi akhir cerita gue. Gue mengubah rasa sakit itu jadi bahan bakar. Gue lebih milih menatap syntax sampai pagi daripada harus menatap layar kosong menunggu kabar dari dia yang sudah lupa. Ini bukan lagi soal dia, ini tentang membuktikan ke diri sendiri bahwa gue bisa membangun sesuatu yang jauh lebih berharga daripada hubungan yang sudah mati. Di sini, logika yang menang di atas perasaan.";
    
    // (Masukkan sisa fungsi asli lo di sini seperti typeLoader, addLog, dll)
    // ...
</script>
</body>
</html>
