<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <style>
        /* Background Foto Lu dengan filter Cyber */
        body { 
            margin: 0; font-family: 'Courier New', monospace; min-height: 100vh;
            background-image: url('554375.webp'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #c9d1d9;
        }
        .overlay { background: rgba(13, 17, 23, 0.85); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        h1 { color: #58a6ff; text-align: center; font-size: 1.8em; }
        
        .code-card { 
            background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; 
            padding: 20px; border-radius: 12px; margin-bottom: 15px; cursor: pointer; 
            transition: 0.3s;
        }
        .code-card:hover { border-color: #58a6ff; transform: scale(1.02); }
        
        .btn-mentor { 
            background: #238636; color: white; padding: 15px; width: 100%; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <h1>> Rey_Code_Academy</h1>
        <p style="text-align:center;">Membentuk generasi programmer masa depan.</p>

        <div id="home">
            <div class="code-card" onclick="showDetail('Basic HTML & CSS', 'Belajar struktur dasar dan desain visual web.')">
                <h3>> 01. Web Foundation</h3>
                <p>HTML & CSS untuk pemula.</p>
            </div>
            <div class="code-card" onclick="showDetail('JavaScript Logic', 'Bikin webmu jadi interaktif dan cerdas.')">
                <h3>> 02. Logic JS</h3>
                <p>Dasar programming web dinamis.</p>
            </div>
        </div>

        <div id="detail" class="hidden" style="background: rgba(22, 27, 34, 0.9); padding: 25px; border-radius: 15px; border: 1px solid #58a6ff;">
            <h2 id="pName" style="color: #58a6ff;"></h2>
            <p id="pDesc"></p>
            <button class="btn-mentor" onclick="order()">Konsultasi dengan Mentor</button>
            <button onclick="goBack()" style="background:none; border:none; color:grey; margin-top:15px; cursor:pointer; display:block; width:100%;">Kembali</button>
        </div>
    </div>
</div>

<script>
    let pName = "";
    // GANTI NOMOR WA LU DI SINI
    const nomorWA = "6283136106128"; 

    function showDetail(name, desc) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('detail').style.display = 'block';
        document.getElementById('pName').innerText = name;
        document.getElementById('pDesc').innerText = desc;
        pName = name;
    }
    function goBack() {
        document.getElementById('home').style.display = 'block';
        document.getElementById('detail').style.display = 'none';
    }
    function order() {
        window.open("https://wa.me/" + nomorWA + "?text=Halo Rey, saya mau tanya soal: " + pName);
    }
</script>
</body>
</html>
