<!DOCTYPE html>
<html lang="id">
<head>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        :root {--bg:#000;--accent:#58a6ff;--glass:rgba(255,255,255,0.06)}
        body{margin:0;font-family:'Segoe UI',sans-serif;color:#fff;background:var(--bg);overflow-x:hidden}
        #bg-video{position:fixed;right:0;bottom:0;min-width:100%;min-height:100%;z-index:-3;object-fit:cover}
        #particles-js{position:fixed;width:100%;height:100%;z-index:-2}
        .container{max-width:600px;margin:auto;padding:20px;padding-bottom:100px}
        
        /* Neon Title & Marquee */
        .marquee-container { overflow: hidden; white-space: nowrap; margin-bottom: 10px; }
        .neon-title { 
            color: var(--accent); 
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent); 
            display: inline-block; 
            animation: marquee 12s linear infinite; 
        }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* Online Dot */
        .online-dot { width: 10px; height: 10px; background: #25D366; border-radius: 50%; display: inline-block; animation: blink 1.2s infinite; margin-right: 8px; box-shadow: 0 0 10px #25D366; }
        @keyframes blink{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
        
        /* Cards, Badges, Progress Bar */
        .card{background:var(--glass);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:18px;margin:12px 0;cursor:pointer;transition:0.3s}
        .badge{background:rgba(88,166,255,0.15);color:var(--accent);padding:4px 10px;border-radius:6px;font-size:0.75em;margin-right:5px;display:inline-block;border:1px solid rgba(88,166,255,0.3)}
        .prog-bg{height:6px;background:#1a1a1a;border-radius:10px;margin-top:10px;overflow:hidden}
        .prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#00d4ff);width:85%;}
        
        /* Modal & FAB */
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;align-items:center;justify-content:center;padding:20px}
        .modal-content{background:#0d1117;padding:30px;border-radius:20px;width:100%;max-width:500px;border:1px solid var(--accent);max-height:80vh;overflow-y:auto}
        .fab{position:fixed;bottom:30px;right:30px;background:#25D366;padding:15px 25px;border-radius:50px;color:#fff;font-weight:bold;z-index:1002;text-decoration:none;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
    </style>
</head>
<body>
    <div id="particles-js"></div>

    </div>

    <script>
        particlesJS("particles-js", {"particles":{"number":{"value":80},"color":{"value":"#ffffff"},"opacity":{"value":0.4},"size":{"value":2},"move":{"speed":0.4}}});
        const mods = {

</body>
</html>
