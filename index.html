<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy - Ultimate Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dark-mode { background-color: #0f172a; }
        .dark-card { background-color: #1e293b !important; color: white !important; }
    </style>
</head>
<body id="body" class="bg-slate-100 min-h-screen flex items-center justify-center p-4 transition-all">

    <div id="card" class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm transition-all">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Secret Room</h2>
            <button id="btn-toggle" class="text-xs bg-gray-200 px-2 py-1 rounded-full">Mode</button>
        </div>

        <div id="login-form" class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-xl outline-blue-400 dark:bg-slate-700">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-xl outline-blue-400 dark:bg-slate-700">
            <button id="btn-login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Masuk / Daftar</button>
        </div>

        <div id="member-area" style="display: none;" class="space-y-4">
            <div id="list-container" class="space-y-3 h-64 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-900 rounded-lg border"></div>
            <div class="border-t pt-4">
                <input type="text" id="input-data" placeholder="Ketik pesan..." class="w-full p-2 border rounded-lg text-sm mb-2 dark:bg-slate-700">
                <button id="btn-add" class="w-full bg-blue-500 text-white py-2 rounded-lg text-sm font-bold">Kirim</button>
            </div>
            <button id="btn-logout" class="w-full bg-rose-500 text-white py-1 rounded-lg text-xs">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { /* ... config lo tetap sama ... */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Dark Mode Logic
        document.getElementById("btn-toggle").onclick = () => {
            document.getElementById("body").classList.toggle("dark-mode");
            document.getElementById("card").classList.toggle("dark-card");
        };

        // Fungsi Bot
        async function runBot(teks) {
            if (teks === "/halo") {
                await addDoc(collection(db, "chat"), { teks: "[BOT]: Halo Rey!", email: "bot@academy.com", date: serverTimestamp() });
            }
        }

        document.getElementById("btn-add").addEventListener("click", async () => {
            const input = document.getElementById("input-data");
            if(input.value) {
                await addDoc(collection(db, "chat"), { teks: input.value, email: auth.currentUser.email, date: serverTimestamp() });
                runBot(input.value);
                input.value = "";
            }
        });

        // Login & Auth (Sama seperti sebelumnya)
        document.getElementById("btn-login").onclick = async () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (e) { await createUserWithEmailAndPassword(auth, email, pass); }
        };

        onAuthStateChanged(auth, (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
            if(user) {
                const q = query(collection(db, "chat"), orderBy("date", "asc"));
                onSnapshot(q, (snapshot) => {
                    const list = document.getElementById("list-container");
                    list.innerHTML = "";
                    snapshot.forEach(docItem => {
                        const data = docItem.data();
                        const div = document.createElement("div");
                        div.className = `p-2 rounded-lg text-xs border max-w-[80%] ${data.email === user.email ? 'bg-blue-100 ml-auto' : 'bg-white dark:bg-slate-700 dark:text-white'}`;
                        div.innerHTML = `<p class="font-bold text-[9px] text-gray-500">${data.email}</p><p>${data.teks}</p>`;
                        list.appendChild(div);
                    });
                    list.scrollTop = list.scrollHeight;
                });
            }
        });

        document.getElementById("btn-logout").onclick = () => signOut(auth);
    </script>
</body>
</html>
