<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Ultimate Dashboard</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; background: #000; overflow-x: hidden; }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }

        .container { max-width: 700px; margin: auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        h1 { color: #58a6ff; font-size: 1.8em; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { color: #8b949e; font-size: 0.8em; letter-spacing: 4px; margin-top: 5px; }

        .story-box { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border: 1px solid rgba(88, 166, 255, 0.2); margin-bottom: 25px; text-align: center; }
        #typing-text { font-style: italic; line-height: 1.6; font-size: 0.95em; color: #c9d1d9; min-height: 70px; }

        .grid { display: grid; gap: 15px; }
        .code-card { background: rgba(22, 27, 34, 0.5); backdrop-filter: blur(5px); border: 1px solid rgba(88, 166, 255, 0.2); padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; }
        .code-card:hover { border-color: #58a6ff; background: rgba(88, 166, 255, 0.1); transform: scale(1.02); }
        .code-card h3 { margin: 0; font-size: 1.1em; color: #58a6ff; }

        .music-btn { position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 10px 15px; background: rgba(88,166,255,0.2); border: 1px solid #58a6ff; border-radius: 50px; cursor: pointer; color: white; font-size: 0.8em; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1001; justify-content: center; align-items: center; overflow-y: auto; padding: 20px; }
        .modal-content { background: #0d1117; padding: 30px; border-radius: 20px; max-width: 600px; width: 100%; border: 1px solid #58a6ff; }
        .btn-wa { background: #238636; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 25px; }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="VID_20250702_110744_839.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<button class="music-btn" onclick="toggleMusic()" id="music-btn">🎵 Music</button>

<div class="container">
    <header>
        <h1>REY_CODE_ACADEMY</h1>
        <div class="subtitle">MENTORSHIP & LOGIC LAB</div>
    </header>

    <div class="story-box">
        <p id="typing-text"></p>
    </div>

    <div class="grid">
        <div class="code-card" onclick="openDetail('Web Development', 'Materi: Web Development\n\nBukan cuma bikin web statis, di sini kita bedah arsitektur Modern Web:\n1. Arsitektur: Deep dive ke sistem Client-Server, RESTful APIs, hingga implementasi GraphQL & Microservices.\n2. Frontend Engine: Fokus pada React.js/Next.js untuk rendering performa tinggi (SSR/SSG), state management kompleks, dan optimasi Core Web Vitals.\n3. Backend & Cloud: Membangun sistem scalable dengan Node.js/Python, database (PostgreSQL/MongoDB), serta integrasi pipeline CI/CD di AWS/Vercel.\n4. Security: Implementasi protokol keamanan OWASP Top 10 dan otentikasi JWT/OAuth.')"><h3>🚀 01. Web Development</h3></div>
        
        <div class="code-card" onclick="openDetail('Mobile Development', 'Materi: Mobile Development\n\nMembangun aplikasi mobile kelas enterprise dengan performa native:\n1. Clean Architecture: Menerapkan pola BLoC/Riverpod atau Redux untuk manajemen state yang bisa di-maintain.\n2. Cross-Platform Expertise: Optimalisasi performa Flutter atau React Native agar mencapai 60 FPS pada skenario kompleks.\n3. Hardware Integration: Eksplorasi mendalam sensor perangkat (Bluetooth Low Energy, GPS, Biometrik) untuk fitur inovatif.\n4. App Lifecycle: Strategi manajemen memori, background processing, dan proses publikasi ke App Store & Play Store yang efisien.')"><h3>📱 02. Mobile Development</h3></div>

        <div class="code-card" onclick="openDetail('Data Science', 'Materi: Data Science\n\nMengubah data mentah menjadi keputusan bisnis yang presisi:\n1. Data Pipeline: Teknik ETL (Extract, Transform, Load) tingkat lanjut menggunakan Pandas, NumPy, dan SQL.\n2. Feature Engineering: Mengolah variabel mentah menjadi fitur yang meningkatkan akurasi model prediktif secara signifikan.\n3. Advanced ML: Implementasi deep learning menggunakan PyTorch atau TensorFlow untuk kasus klasifikasi/regresi/klastering.\n4. Data Storytelling: Visualisasi dashboard interaktif yang menceritakan insight bisnis bukan sekadar angka.')"><h3>📊 03. Data Science</h3></div>

        <div class="code-card" onclick="openDetail('Game Development', 'Materi: Game Development\n\nCiptakan dunia virtual dengan logika fisik yang akurat:\n1. Game Engine Mastery: Eksplorasi mendalam C# pada Unity atau C++/Blueprints pada Unreal Engine.\n2. Rendering & Math: Penguasaan Vektor, Matriks, Trigonometri, dan Shader untuk optimasi grafis yang memukau.\n3. Advanced Physics: Simulasi gravitasi, collision detection, dan optimasi hitboxes.\n4. Systems Design: AI untuk NPC, arsitektur multiplayer/netcode, dan manajemen memori untuk aset 3D yang berat.')"><h3>🎮 04. Game Development</h3></div>

        <div class="code-card" onclick="openDetail('UI/UX Design', 'Materi: UI/UX Design\n\nDesain yang berpusat pada manusia dan konversi tinggi:\n1. Design Systems: Membangun library komponen yang skalabel untuk konsistensi produk.\n2. Accessibility (A11y): Standarisasi WCAG agar aplikasi inklusif untuk semua pengguna.\n3. Interactive Prototyping: Menguasai Figma untuk animasi micro-interaction dan testing usabilitas.\n4. User Psychology: Penerapan hukum Gestalt dan bias kognitif dalam desain untuk meningkatkan retensi pengguna.')"><h3>🎨 05. UI/UX Design</h3></div>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mTitle" style="color: #58a6ff; margin-top:0;"></h2>
        <p id="mDesc" style="line-height: 1.8; white-space: pre-line; color:#c9d1d9; font-size: 0.95em;"></p>
        <button class="btn-wa" onclick="hubungiMentor()">Konsultasi Intensif dengan Mentor</button>
    </div>
</div>

<script>
    const text = "Dulu, gue pikir memperbaiki hati itu sama kayak memperbaiki bug. Ternyata cinta jauh lebih rumit daripada syntax. Gue memilih untuk fokus membangun masa depan melalui kode. Selamat datang di tempat di mana logika menang atas perasaan.";
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 30);
        }
    }
    window.onload = typeWriter;

    function toggleMusic() {
        // Karena audio gak dipakai, tombol ini buat kasih efek "siap" aja
        alert("Sistem siap. Siap untuk ngoding?");
    }
    function openDetail(title, desc) {
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function hubungiMentor() { window.open("https://wa.me/628xxxxxxxxxx?text=Halo Rey, saya ingin diskusi mendalam tentang " + document.getElementById('mTitle').innerText); }
</script>
</body>
</html>
