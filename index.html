<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <style>
        body { margin: 0; font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 700px; margin: auto; }
        h1 { color: #58a6ff; text-align: center; font-size: 1.8em; }
        .status { text-align: center; color: #238636; font-size: 0.9em; margin-bottom: 30px; }
        
        .story-box { background: rgba(88, 166, 255, 0.05); padding: 25px; border-radius: 15px; 
                     margin-bottom: 30px; border-left: 5px solid #58a6ff; min-height: 150px; }
        
        .code-card { background: #161b22; border: 1px solid #30363d; padding: 25px; 
                     border-radius: 15px; margin-bottom: 20px; cursor: pointer; transition: 0.4s; }
        .code-card:hover { border-color: #58a6ff; transform: scale(1.02); }
        
        .hidden { display: none; }
        .materi-box { background: #0d1117; padding: 30px; border-radius: 20px; border: 1px solid #58a6ff; }
        .btn-wa { background: #238636; color: white; padding: 20px; width: 100%; border: none; 
                  border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 30px; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h1>> REY_CODE_ACADEMY</h1>
    <p class="status">● Mentor Aktif | Slot Terbatas</p>

    <div class="story-box">
        <h3 style="margin-top: 0; color: #58a6ff;">> Tentang Rey</h3>
        <p id="typing-text" style="font-style: italic; line-height: 1.6;"></p>
    </div>

    <div id="home">
        <div class="code-card" onclick="openMateri('Web Development', 'ASAL USUL: Lahir 1989 di CERN. \n\nPENJELASAN MENDALAM: Web Dev adalah arsitektur digital paling krusial. Kita membangun dari Frontend (HTML5, CSS3, JavaScript) hingga Backend (Node.js) agar sistem bisa mengolah data secara real-time.')">
            <h3>🚀 01. Web Development</h3>
        </div>
        <div class="code-card" onclick="openMateri('Mobile Development', 'ASAL USUL: Revolusi Smartphone 2007. \n\nPENJELASAN MENDALAM: Fokus pada aplikasi yang berjalan di ekosistem terbatas namun powerfull. Kita belajar Native (Kotlin/Swift) atau Cross-Platform (Flutter). Tantangannya adalah manajemen memori yang ketat.')">
            <h3>📱 02. Mobile Development</h3>
        </div>
        <div class="code-card" onclick="openMateri('Data Science', 'ASAL USUL: Statistika era Big Data. \n\nPENJELASAN MENDALAM: Data Science adalah detektif modern. Kita mengubah data mentah menjadi wawasan berharga menggunakan Python (NumPy, Pandas, ML) untuk prediksi masa depan.')">
            <h3>📊 03. Data Science</h3>
        </div>
        <div class="code-card" onclick="openMateri('Game Development', 'ASAL USUL: Eksperimen fisik 1950-an. \n\nPENJELASAN MENDALAM: Game Dev adalah simulasi realita. Kita menggunakan engine (Unity/Godot) untuk membangun hukum fisika, sistem rendering 3D, dan logika AI.')">
            <h3>🎮 04. Game Development</h3>
        </div>
        <div class="code-card" onclick="openMateri('UI/UX Design', 'ASAL USUL: Ergonomi industri & Apple Design. \n\nPENJELASAN MENDALAM: UI (Tampilan) & UX (Perasaan). Fokus pada psikologi pengguna, hierarki visual, dan efisiensi agar aplikasi terasa sangat intuitif.')">
            <h3>🎨 05. UI/UX Design</h3>
        </div>
    </div>

    <div id="materi" class="hidden">
        <div class="materi-box">
            <h2 id="mTitle" style="color: #58a6ff; border-bottom: 2px solid #58a6ff; padding-bottom: 10px;"></h2>
            <p id="mDesc" style="line-height: 1.8; white-space: pre-line; color: #d1d5da;"></p>
            <button class="btn-wa" onclick="hubungiMentor()">Konsultasi dengan Mentor Rey</button>
            <button onclick="backToHome()" style="background:none; border:none; color:grey; margin-top:30px; width:100%; cursor:pointer;">Kembali ke Menu Utama</button>
        </div>
    </div>
</div>

<script>
    // Efek Typing
    const text = '"Dulu, gue pikir bisa memperbaiki hati yang rusak sama seperti memperbaiki bug di kodingan. Ternyata, cinta jauh lebih rumit daripada syntax manapun. Tapi dari kegagalan itu, gue sadar: daripada memikirkan yang pergi, lebih baik membangun sesuatu yang bertahan selamanya. Gue memilih menulis baris kode dan membantu lu tumbuh. Selamat datang di tempat di mana logika menang atas perasaan."';
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 30);
        }
    }
    window.onload = typeWriter;

    // Logika Navigasi
    let currentMateri = "";
    const nomorWA = "628xxxxxxxxxx"; // GANTI NOMOR WA LU

    function openMateri(title, desc) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('materi').style.display = 'block';
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        currentMateri = title;
    }
    function backToHome() {
        document.getElementById('home').style.display = 'block';
        document.getElementById('materi').style.display = 'none';
    }
    function hubungiMentor() {
        window.open("https://wa.me/" + nomorWA + "?text=Halo Rey, saya ingin diskusi lebih lanjut tentang materi " + currentMateri + ".");
    }
</script>
</body>
</html>
