<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Expert Roadmap</title>
    <style>
        :root { --bg: #000; --text: #fff; --accent: #58a6ff; --card-bg: rgba(255,255,255,0.03); --accent-glow: 0 0 10px #58a6ff, 0 0 20px #58a6ff; }
        .light-mode { --bg: #f0f2f5; --text: #000; --accent: #0969da; --card-bg: rgba(0,0,0,0.03); --accent-glow: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); transition: 0.3s; overflow-x: hidden; }
        .online-dot { width: 10px; height: 10px; background: #25D366; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 10px #25D366; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%); z-index: -1; }
        
        /* Fitur Baru */
        #breach-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: red; font-family: monospace; }
        #canvas-matrix { position: fixed; top:0; left:0; z-index: -3; opacity: 0.2; }
        #auto-save { position: fixed; top: 10px; right: 20px; font-size: 0.6em; color: var(--accent); font-family: 'Courier New', monospace; z-index: 100; }

        /* Loader & Komponen Asli */
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--accent); }
        #loading-text { font-family: 'Courier New', monospace; font-size: 1.2em; text-align: center; padding: 0 20px; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 70px; transition: 0.3s; }
        .story-box { background: var(--card-bg); backdrop-filter: blur(10px); padding: 18px; border-radius: 15px; margin-bottom: 18px; border: 1px solid rgba(88, 166, 255, 0.15); }
        #typing-text { font-style: italic; line-height: 1.5; font-size: 0.82em; color: rgba(255,255,255,0.75); }
        .animated-title { font-size: 1.6em; letter-spacing: 2px; color: var(--accent); text-shadow: var(--accent-glow); margin: 0; }
    </style>
</head>
<body>

<div id="breach-screen">
    <h1>ACCESS_DENIED</h1>
    <input type="password" id="auth-key" placeholder="Enter Authorization Key" style="background:#000; color:red; border:1px solid red; padding:10px;">
    <button onclick="checkAuth()" style="margin-top:10px; cursor:pointer;">AUTHORIZE</button>
</div>

<div id="auto-save">> [SYSTEM] Data synced: 98%</div>
<canvas id="canvas-matrix"></canvas>

<div id="loader">
    <div id="loading-text"></div>
    <div style="font-size: 0.6em; margin-top:10px; color: #58a6ff; letter-spacing: 2px;">REY_CODE_ACADEMY_SYSTEM</div>
</div>

<video autoplay muted loop playsinline id="bg-video"><source src="VID_20250702_110744_839.mp4" type="video/mp4"></video>
<div class="overlay"></div>

<div class="container">
    <header>
        <h1 class="animated-title">REY_CODE_ACADEMY</h1>
    </header>
    <div class="story-box"><p id="typing-text"></p></div>
</div>

<script>
    // 1. Breach & Matrix Logic
    function checkAuth() { if(document.getElementById('auth-key').value === "rey57") document.getElementById('breach-screen').style.display = 'none'; else alert("WRONG KEY"); }
    const canvas = document.getElementById('canvas-matrix'); const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/20)).fill(1);
    function draw() { ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#0F0'; drops.forEach((y, i) => { ctx.fillText(Math.floor(Math.random()*2), i*20, y*20); if(y*20 > canvas.height) drops[i] = 0; drops[i]++; }); }
    setInterval(draw, 50);
    setInterval(() => document.getElementById('auto-save').innerText = `> [SYSTEM] Data synced: ${Math.floor(Math.random()*100)}%`, 3000);

    // 2. Loader Logic
    const loaderText = document.getElementById("loading-text");
    const messages = ["Mencari ambisi yang hilang...", "Menyingkirkan kode sampah...", "Membangun standar yang tak bisa ditawar...", "Selamat datang di ruang gue."];
    let msgIndex = 0, charIndex = 0;
    function typeLoader() {
        if (msgIndex < messages.length) {
            if (charIndex < messages[msgIndex].length) {
                loaderText.innerHTML += messages[msgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeLoader, 50);
            } else {
                setTimeout(() => { loaderText.innerHTML = ""; charIndex = 0; msgIndex++; typeLoader(); }, 1000);
            }
        } else {
            document.getElementById('loader').style.display = 'none';
            typeWriter();
        }
    }
    typeLoader();

    // 3. Main Text Logic
    const text = "Selamat datang di Rey Code Academy. Tempat di mana gue menukar air mata dengan logika. Gue pernah berada di titik terendah, dihancurkan oleh ekspektasi dan ditinggalkan oleh orang yang gue pikir bakal ada di sana selamanya. Perihnya masih kerasa, tapi gue nggak akan membiarkan itu jadi akhir cerita gue. Gue mengubah rasa sakit itu jadi bahan bakar. Gue lebih milih menatap syntax sampai pagi daripada harus menatap layar kosong menunggu kabar dari dia yang sudah lupa. Ini bukan lagi soal dia, ini tentang membuktikan ke diri sendiri bahwa gue bisa membangun sesuatu yang jauh lebih berharga daripada hubungan yang sudah mati. Di sini, logika yang menang di atas perasaan.";
    let i = 0; 
    function typeWriter() { if (i < text.length) { document.getElementById("typing-text").innerHTML += text.charAt(i); i++; setTimeout(typeWriter, 20); } }
</script>
</body>
</html>
