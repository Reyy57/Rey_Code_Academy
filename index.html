<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 95%; padding: 10px; margin-top: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-form">
            <h2>Login Academy</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="btn-login">Login</button>
        </div>

        <div id="member-area" style="display: none;">
            <h2>Halo, <span id="user-email" style="color: #007bff;"></span>!</h2>
            <p id="pesan-dari-admin" style="font-weight: bold; color: #333;"></p>
            
            <div id="admin-tools" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px;">
                <input type="text" id="input-pesan" placeholder="Update pesan di sini...">
                <button id="btn-update" style="background: #28a745;">Update Pesan</button>
            </div>
            
            <button id="btn-logout" style="background: #dc3545;">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCWxhWyiu9JLBsVzkHjE-x4UcSsMUzp8cI",
            authDomain: "rey-code-academy.firebaseapp.com",
            projectId: "rey-code-academy",
            storageBucket: "rey-code-academy.firebasestorage.app",
            messagingSenderId: "777024739059",
            appId: "1:777024739059:web:440f7a64ddf5bc7017c986"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ID Database lo
        const docId = "5dCeukL4hDZROHKnOUth"; 

        document.getElementById("btn-login").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, email, pass).catch((e) => alert("Error: " + e.message));
        });

        document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

        document.getElementById("btn-update").addEventListener("click", async () => {
            const teksBaru = document.getElementById("input-pesan").value;
            if(teksBaru) {
                const docRef = doc(db, "pesan", docId);
                await updateDoc(docRef, { teks: teksBaru });
                document.getElementById("pesan-dari-admin").innerText = teksBaru;
                alert("Pesan berhasil diupdate!");
            }
        });

        onAuthStateChanged(auth, async (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
            
            if(user) {
                document.getElementById("user-email").innerText = user.email;
                const querySnapshot = await getDocs(collection(db, "pesan"));
                querySnapshot.forEach((doc) => {
                    document.getElementById("pesan-dari-admin").innerText = doc.data().teks;
                });
            }
        });
    </script>
</body>
</html>
