<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Expert Roadmap</title>
    <style>
        :root { --bg: #000; --text: #fff; --accent: #58a6ff; --card-bg: rgba(255,255,255,0.03); --accent-glow: 0 0 10px #58a6ff, 0 0 20px #58a6ff; }
        .light-mode { --bg: #f0f2f5; --text: #000; --accent: #0969da; --card-bg: rgba(0,0,0,0.03); --accent-glow: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); transition: 0.3s; overflow-x: hidden; }
        .online-dot { width: 10px; height: 10px; background: #25D366; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 10px #25D366; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%); z-index: -1; }
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index: 9999; display: flex; justify-content: center; align-items: center; color: var(--accent); font-weight: bold; font-size: 0.9em; }
        .container { max-width: 600px; margin: auto; padding: 15px; padding-bottom: 70px; }
        @media (min-width: 768px) { .container { max-width: 900px; } }
        
        .section-title { color: var(--accent); margin: 40px 0 20px 0; font-size: 1.1em; border-left: 4px solid var(--accent); padding-left: 10px; }
        .service-grid { display: grid; gap: 15px; grid-template-columns: 1fr 1fr; margin-bottom: 20px; }
        .service-card { background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; padding: 15px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; color: #fff; }
        .service-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .service-icon { font-size: 1.8em; display: block; margin-bottom: 5px; }

        .story-box { background: var(--card-bg); backdrop-filter: blur(10px); padding: 18px; border-radius: 15px; margin-bottom: 18px; border: 1px solid rgba(88, 166, 255, 0.15); }
        #typing-text { font-style: italic; line-height: 1.5; font-size: 0.82em; color: rgba(255,255,255,0.75); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1001; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: var(--bg); padding: 18px; border-radius: 15px; max-width: 360px; width: 90%; border: 1px solid var(--accent); color: var(--text); }
        .close-modal-btn { position: absolute; top: 10px; right: 15px; color: var(--accent); cursor: pointer; font-size: 1.2em; }
        .btn-wa { background: #238636; color: white; padding: 11px; width: 100%; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 13px; font-size: 0.85em; }
    </style>
</head>
<body>

<div id="loader">Selamat datang diRey Code Academy...</div>
<video autoplay muted loop playsinline id="bg-video"><source src="VID_20250702_110744_839.mp4" type="video/mp4"></video>
<div class="overlay"></div>

<div class="container">
    <header>
        <div class="title-row">
            <h1 style="font-size: 1.6em; color: var(--accent); margin: 0;"><span class="online-dot"></span> REY_CODE_ACADEMY</h1>
        </div>
        <div onclick="toggleTheme()" style="cursor:pointer; font-size: 0.7em; color:var(--accent); margin-top: 5px;">🌓 Ganti Mode</div>
    </header>

    <div class="story-box"><p id="typing-text"></p></div>

    <h2 class="section-title">SKILL & EXPERTISE</h2>
    <div class="service-grid" id="skill-grid"></div>

    <h2 class="section-title">PRICE LIST & JASA</h2>
    <div class="service-grid" id="price-grid"></div>

    <div class="story-box" id="chat-container">
        <h3 style="font-size:0.85em; color:var(--accent);">🤖 REY_BOT LIVE CHAT</h3>
        <div id="chat-list" style="height: 120px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; font-size: 0.75em; border: 1px solid #30363d;">
            <div style="color: #8b949e;">ReyBot: Halo. Mau tanya soal harga atau jasa? Klik kotak di atas atau tanya langsung ke gue.</div>
        </div>
        <input type="text" id="chat-input" placeholder="Tulis sesuatu..." style="width: 100%; background: #161b22; border: 1px solid #30363d; padding: 8px; border-radius: 5px; color: white; margin-top:10px;">
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content" style="position:relative;">
        <span class="close-modal-btn" onclick="closeModal()">×</span>
        <h2 id="mTitle" style="color:var(--accent); font-size:1.1em;"></h2>
        <div id="mDesc" style="font-size:0.8em; line-height:1.6; color:#c9d1d9;"></div>
        <button class="btn-wa" onclick="hubungiMentor()">Start Consultation</button>
    </div>
</div>

<script>
    const skills = {
        "Next.js": { icon: "⚛️", desc: "Expert dalam membangun web performa tinggi dengan arsitektur modern." },
        "Node.js": { icon: "🚀", desc: "Backend stabil & aman untuk sistem skala besar." },
        "Flutter": { icon: "📱", desc: "Aplikasi mobile lintas platform performa native." },
        "UI/UX": { icon: "🎨", desc: "Desain antarmuka modern & user-friendly." }
    };
    const prices = {
        "Bikin Web": { icon: "🌐", desc: "<strong>Harga: Mulai Rp 1.5jt</strong><br>Web modern, responsif, SEO friendly." },
        "Mobile App": { icon: "📱", desc: "<strong>Harga: Mulai Rp 2.5jt</strong><br>Aplikasi Android & iOS (Flutter)." },
        "Fix Bug": { icon: "🛠️", desc: "<strong>Harga: Mulai Rp 200rb</strong><br>Perbaikan error kodingan dengan cepat." },
        "Data/AI": { icon: "🤖", desc: "<strong>Harga: Mulai Rp 2jt</strong><br>Automasi data & integrasi AI bisnis." }
    };

    function createGrid(data, containerId) {
        const container = document.getElementById(containerId);
        for (let key in data) {
            container.innerHTML += `
                <div class="service-card" onclick="openDetail('${key}', '${containerId}')">
                    <span class="service-icon">${data[key].icon}</span>
                    <div style="font-weight:bold; font-size:0.85em;">${key}</div>
                </div>`;
        }
    }
    createGrid(skills, 'skill-grid');
    createGrid(prices, 'price-grid');

    function openDetail(key, type) {
        const data = (type === 'skill-grid') ? skills[key] : prices[key];
        document.getElementById('mTitle').innerText = key;
        document.getElementById('mDesc').innerHTML = data.desc;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function hubungiMentor() { window.open("https://wa.me/628xxxxxxxxxx?text=Halo Rey, saya mau tanya soal " + document.getElementById('mTitle').innerText); }

    // BOT
    function getBotResponse(text) {
        text = text.toLowerCase();
        if (text.includes("harga") || text.includes("biaya")) return "Cek harga detailnya di kotak 'PRICE LIST' di atas ya. Klik aja salah satu kotaknya!";
        return "Gue ReyBot. Ada yang bisa gue bantu soal jasa koding gue?";
    }
    document.getElementById('chat-input').onkeypress = (e) => {
        if(e.key === 'Enter' && e.target.value.trim() !== "") {
            const val = e.target.value;
            const list = document.getElementById('chat-list');
            list.innerHTML += `<div><b>Lo:</b> ${val}</div>`;
            const resp = getBotResponse(val);
            list.innerHTML += `<div><b>ReyBot:</b> ${resp}</div>`;
            e.target.value = "";
            list.scrollTop = list.scrollHeight;
        }
    };
    
    // Typing text
    const text = "Kode adalah satu-satunya hal yang tidak akan pernah berkhianat. Fokus pada hasil, abaikan gangguan.";
    let i = 0; function typeWriter() { if (i < text.length) { document.getElementById("typing-text").innerHTML += text.charAt(i); i++; setTimeout(typeWriter, 20); } }
    window.onload = () => { typeWriter(); document.getElementById('loader').style.display = 'none'; };
</script>
</body>
</html>
