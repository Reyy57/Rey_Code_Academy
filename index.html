<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <style>
        body { margin: 0; font-family: 'Courier New', monospace; min-height: 100vh;
               background-image: url('554375.webp'); /* Pastikan file ini ada */
               background-size: cover; background-position: center; background-attachment: fixed;
               color: #c9d1d9; }
        .overlay { background: rgba(13, 17, 23, 0.9); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        h1 { color: #58a6ff; text-align: center; }
        
        .code-card { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; 
                     padding: 20px; border-radius: 12px; margin-bottom: 15px; cursor: pointer; }
        
        .hidden { display: none; }
        .materi-box { background: #161b22; padding: 25px; border-radius: 15px; border: 1px solid #58a6ff; }
        .btn-wa { background: #238636; color: white; padding: 15px; width: 100%; border: none; 
                  border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <h1>> Rey_Code_Academy</h1>

        <div id="home">
            <div class="code-card" onclick="openMateri('Web Dev', 'Web Development adalah proses membangun website. HTML adalah kerangkanya, CSS adalah pakaiannya, dan JavaScript adalah otaknya.')">
                <h3>> 01. Web Development</h3>
                <p>Klik untuk baca materi singkat.</p>
            </div>
            <div class="code-card" onclick="openMateri('Mobile App', 'Mobile development membuat aplikasi untuk smartphone. Kita menggunakan bahasa seperti Flutter atau React Native untuk Android dan iOS.')">
                <h3>> 02. Mobile Development</h3>
                <p>Klik untuk baca materi singkat.</p>
            </div>
            </div>

        <div id="materi" class="hidden">
            <div class="materi-box">
                <h2 id="mTitle" style="color: #58a6ff;"></h2>
                <p id="mDesc" style="line-height: 1.6;"></p>
                <button class="btn-wa" onclick="hubungiMentor()">Tanya Mentor Lebih Lanjut</button>
                <button onclick="backToHome()" style="background:none; border:none; color:grey; margin-top:20px; width:100%; cursor:pointer;">Kembali</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentMateri = "";
    const nomorWA = "628xxxxxxxxxx"; // GANTI NOMOR WA LU

    function openMateri(title, desc) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('materi').style.display = 'block';
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        currentMateri = title;
    }
    function backToHome() {
        document.getElementById('home').style.display = 'block';
        document.getElementById('materi').style.display = 'none';
    }
    function hubungiMentor() {
        window.open("https://wa.me/" + nomorWA + "?text=Halo Rey, saya sudah baca materi " + currentMateri + " dan ingin bertanya lebih dalam.");
    }
</script>
</body>
</html>
