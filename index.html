        "Mobile Development": {
            tags: ["Flutter", "Kotlin", "SwiftUI", "Firebase"],
            desc: "<strong>10-Step Mastering Roadmap:</strong><br><br>1. <strong>Mobile Arch:</strong> Clean Architecture (MVVM/BLoC/Riverpod).<br>2. <strong>Native UI:</strong> Declarative UI with Jetpack Compose & SwiftUI.<br>3. <strong>Async Ops:</strong> Background processing, Isolates & Coroutines.<br>4. <strong>Networking:</strong> Dio/Retrofit & WebSocket real-time data.<br>5. <strong>Local Storage:</strong> SQLite, Hive, & Encrypted SharedPrefs.<br>6. <strong>Hardware:</strong> Bluetooth LE, GPS, Camera & Sensor fusion.<br>7. <strong>Testing:</strong> Widget testing & Integration testing.<br>8. <strong>Firebase:</strong> Auth, Firestore, Analytics & Crashlytics.<br>9. <strong>Security:</strong> SSL Pinning & Obfuscation.<br>10. <strong>Distribution:</strong> Store guidelines, OTA updates & A/B testing."

        },

            tags: ["Figma", "Research", "Interaction"],
            desc: "<strong>10-Step Mastering Roadmap:</strong><br><br>1. <strong>Design Thinking:</strong> Empathy, Ideate, Prototype, Test.<br>2. <strong>Research:</strong> User Persona, Journey Maps & Stakeholder analysis.<br>3. <strong>Wireframing:</strong> Low-fi concepts & Information Architecture.<br>4. <strong>Design Systems:</strong> Global Tokens, Atomic components & Documentation.<br>5. <strong>Visual Design:</strong> Typography, Color theory & Layout Grids.<br>6. <strong>Prototyping:</strong> Advanced interactions, Variables & Auto-Layout.<br>7. <strong>Micro-interactions:</strong> Animated states & Lottie integration.<br>8. <strong>Accessibility:</strong> WCAG 2.1 compliance & Inclusive design.<br>9. <strong>Usability:</strong> Heuristic evaluation & User testing tools.<br>10. <strong>Collaboration:</strong> Dev Handoff, Spec documentation & Review."

    const grid = document.getElementById('menu-grid');
    for (let key in modules) {
        grid.innerHTML += `
            <div class="card" onclick="openDetail('${key}')">

        `;
    }

    window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000); });

    let i = 0;
    function typeWriter() {
        if (i < text.length) { document.getElementById("typing-text").innerHTML += text.charAt(i); i++; setTimeout(typeWriter, 20); }
    }
    window.onload = typeWriter;
    function openDetail(title) { document.getElementById('mTitle').innerText = title; document.getElementById('mDesc').innerHTML = modules[title].desc; document.getElementById('modal').style.display = 'flex'; }

    function hubungiMentor() { window.open("https://wa.me/628xxxxxxxxxx?text=Halo Rey, saya ingin diskusi tentang " + document.getElementById('mTitle').innerText); }
