<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Store Professional</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; min-height: 100vh;
               background-image: url('554375.webp'); 
               background-size: cover; background-position: center; background-attachment: fixed; }
        .overlay { background: rgba(0,0,0,0.7); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        h1 { text-align: center; color: #f1c40f; margin-bottom: 30px; text-shadow: 2px 2px 4px #000; }
        
        .card { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
                padding: 20px; border-radius: 15px; margin-bottom: 15px; 
                cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(5px); }
        .card:hover { background: rgba(255,255,255,0.2); }
        
        .hidden { display: none; }
        .detail-box { background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px; 
                      text-align: center; border: 2px solid #f1c40f; color: white; }
        .btn-pesan { background: #f1c40f; color: black; padding: 15px; width: 100%; 
                     border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-back { background: #555; color: white; padding: 10px; border: none; 
                    border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        <h1>Rey Store 🛒</h1>

        <div id="home">
            <div class="card" onclick="showDetail('Free Fire', 'Skin Sultan & Diamond Murah')">
                <h3>Free Fire</h3>
                <p>Proses Cepat & Otomatis</p>
            </div>
            <div class="card" onclick="showDetail('Mobile Legends', 'Joki Mythic & Diamond')">
                <h3>Mobile Legends</h3>
                <p>Layanan 24 Jam</p>
            </div>
        </div>

        <div id="detail" class="hidden">
            <div class="detail-box">
                <h2 id="pName"></h2>
                <p id="pDesc"></p>
                <button class="btn-pesan" onclick="order()">Pesan Sekarang!</button>
                <button class="btn-back" onclick="goBack()">Kembali</button>
            </div>
        </div>
    </div>
</div>

<script>
    let pName = "";
    
    // --- GANTI NOMOR DI BAWAH INI (PAKE 62) ---
    const nomorWA = "6283136196128"; 

    function showDetail(name, desc) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('detail').style.display = 'block';
        document.getElementById('pName').innerText = name;
        document.getElementById('pDesc').innerText = desc;
        pName = name;
    }
    function goBack() {
        document.getElementById('home').style.display = 'block';
        document.getElementById('detail').style.display = 'none';
    }
    function order() {
        window.open("https://wa.me/" + nomorWA + "?text=Halo Rey, saya mau beli: " + pName);
    }
</script>
</body>
</html>
