<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Ultimate Handbook</title>
    <style>
        body { margin: 0; font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 800px; margin: auto; animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h1 { color: #58a6ff; text-align: center; font-size: 2em; text-shadow: 0 0 10px rgba(88, 166, 255, 0.3); }
        .status { text-align: center; color: #238636; font-size: 0.85em; margin-bottom: 40px; letter-spacing: 2px; }
        
        .story-box { background: rgba(88, 166, 255, 0.03); padding: 30px; border-radius: 20px; 
                     margin-bottom: 40px; border: 1px solid #30363d; }
        
        .code-card { background: #161b22; border: 1px solid #30363d; padding: 30px; 
                     border-radius: 20px; margin-bottom: 20px; cursor: pointer; transition: 0.4s; }
        .code-card:hover { border-color: #58a6ff; box-shadow: 0 0 20px rgba(88, 166, 255, 0.15); transform: translateY(-3px); }
        
        .hidden { display: none; }
        .materi-box { background: #0d1117; padding: 40px; border-radius: 25px; border: 1px solid #58a6ff; box-shadow: 0 0 30px rgba(88, 166, 255, 0.1); }
        .btn-wa { background: #238636; color: white; padding: 20px; width: 100%; border: none; 
                  border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 40px; font-size: 1.1em; transition: 0.3s; }
        .btn-wa:hover { background: #2ea043; transform: scale(1.01); }
        hr { border: 0; height: 1px; background: #30363d; margin: 40px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>> REY_CODE_ACADEMY</h1>
    <p class="status">● MENTOR_AKTIF // SLOT_TERBATAS</p>

    <div class="story-box">
        <h3 style="margin-top: 0; color: #58a6ff;">> Tentang Rey</h3>
        <p id="typing-text" style="font-style: italic; line-height: 1.7;"></p>
    </div>

    <hr>

    <div id="home">
        <div class="code-card" onclick="openMateri('Web Development', 'ASAL USUL: Lahir 1989 di CERN oleh Tim Berners-Lee.\n\nPENJELASAN MENDALAM: Web Development adalah arsitektur sistem informasi terbesar di dunia. \n1. FRONTEND: Menggunakan HTML5 (semantik), CSS3 (layout modern), dan JavaScript (ES6+ untuk interaksi). Ini adalah wajah yang berinteraksi langsung dengan user. \n2. BACKEND: Otak di balik layar menggunakan Node.js atau Python, mengelola Database (SQL/NoSQL), dan API. \n3. INFRASTRUKTUR: HTTP, DNS, Security (HTTPS), dan Deployment ke cloud. \n\nKESIMPULAN: Website adalah aplikasi yang bisa diakses milyaran orang tanpa perlu instalasi. Ini adalah senjata utama di era digital.')">
            <h3>🚀 01. Web Development</h3>
        </div>
        <div class="code-card" onclick="openMateri('Mobile Development', 'ASAL USUL: Meledak setelah perilisan iPhone (2007) dan Android (2008).\n\nPENJELASAN MENDALAM: Mobile Development adalah seni efisiensi dan optimasi hardware. \n1. NATIVE: Kotlin (Android) atau Swift (iOS) untuk performa maksimal dan akses sensor hardware penuh. \n2. CROSS-PLATFORM: Flutter (Dart) atau React Native untuk efisiensi kode satu untuk semua. \n3. KONSEP KRUSIAL: Lifecycle (siklus hidup aplikasi), Memory Management, dan State Management. \n\nKESIMPULAN: Smartphone adalah komputer utama manusia. Mobile Developer membangun alat yang selalu ada di dalam saku 24/7.')">
            <h3>📱 02. Mobile Development</h3>
        </div>
        <div class="code-card" onclick="openMateri('Data Science', 'ASAL USUL: Evolusi statistika terapan di era Big Data.\n\nPENJELASAN MENDALAM: Data Science adalah detektif modern. Kita tidak hanya coding, tapi membangun logika untuk meramal masa depan dari tumpukan data. \n1. DATA WRANGLING: Pandas/NumPy untuk membersihkan jutaan baris data. \n2. EDA: Visualisasi pola tersembunyi dengan Matplotlib/Seaborn. \n3. MACHINE LEARNING: Scikit-Learn/TensorFlow untuk prediksi tren dan deteksi pola. \n\nKESIMPULAN: Data Scientist mengubah angka menjadi kebijakan bisnis bernilai triliunan.')">
            <h3>📊 03. Data Science</h3>
        </div>
        <div class="code-card" onclick="openMateri('Game Development', 'ASAL USUL: Bermula dari simulasi lab 1950-an hingga industri hiburan terbesar dunia.\n\nPENJELASAN MENDALAM: Game Dev adalah kasta tertinggi software engineering karena menuntut efisiensi (60 FPS). \n1. ENGINE: Unity (C#) atau Unreal (C++). Engine adalah dunia di mana kita mengatur hukum fisika. \n2. MATEMATIKA: Aljabar Linier (vektor/matriks) untuk pergerakan 3D, deteksi tabrakan (collision), dan ray-tracing. \n3. LOGIKA AI: Membangun musuh yang bisa berpikir menggunakan Behavior Trees. \n\nKESIMPULAN: Game Dev adalah menciptakan dunia dengan hukum alam sendiri.')">
            <h3>🎮 04. Game Development</h3>
        </div>
        <div class="code-card" onclick="openMateri('UI/UX Design', 'ASAL USUL: Ergonomi industri dipopulerkan Don Norman untuk hubungan manusia-mesin.\n\nPENJELASAN MENDALAM: UI/UX bukan warna cantik, tapi memecahkan masalah pengguna secara psikologis. \n1. UX: Riset persona, user journey, dan testing untuk memastikan aplikasi mudah dipakai. \n2. UI: Hierarki visual, kontras warna, tipografi, dan aksesibilitas agar mata nyaman. \n3. DESIGN THINKING: Proses empatik untuk memastikan solusi benar-benar dibutuhkan. \n\nKESIMPULAN: UI/UX adalah jembatan empati antara logika mesin yang dingin dan kenyamanan manusia.')">
            <h3>🎨 05. UI/UX Design</h3>
        </div>

        <div style="text-align: center; margin-top: 50px;">
            <button onclick="getRandomWisdom()" style="background: transparent; border: 1px solid #58a6ff; color: #58a6ff; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s;">Dapatkan Inspirasi Coding</button>
            <p id="wisdom" style="margin-top: 20px; font-style: italic; color: #8b949e;"></p>
        </div>
    </div>

    <div id="materi" class="hidden">
        <div class="materi-box">
            <h2 id="mTitle" style="color: #58a6ff; border-bottom: 2px solid #58a6ff; padding-bottom: 15px;"></h2>
            <p id="mDesc" style="line-height: 1.9; white-space: pre-line; color: #d1d5da;"></p>
            <button class="btn-wa" onclick="hubungiMentor()">Konsultasi Intensif dengan Mentor Rey</button>
            <button onclick="backToHome()" style="background:none; border:none; color:grey; margin-top:30px; width:100%; cursor:pointer;">Kembali ke Menu Utama</button>
        </div>
    </div>

    <footer><p style="text-align:center; color: #444; margin-top: 80px; font-size: 0.8em;">&copy; 2026 Rey Code Academy</p></footer>
</div>

<script>
    const text = '"Dulu, gue pikir bisa memperbaiki hati yang rusak sama seperti memperbaiki bug di kodingan. Ternyata, cinta jauh lebih rumit daripada syntax manapun. Tapi dari kegagalan itu, gue sadar: daripada memikirkan yang pergi, lebih baik membangun sesuatu yang bertahan selamanya. Gue memilih menulis baris kode dan membantu lu tumbuh. Selamat datang di tempat di mana logika menang atas perasaan."';
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 20);
        }
    }
    window.onload = typeWriter;

    function getRandomWisdom() {
        const quotes = ["Programmer hebat menulis kode untuk manusia.", "Debugging = Detektif kriminal.", "Jangan perbaiki yang tidak rusak.", "Coding = Efisiensi masalah.", "Logika kode tidak pernah bohong."];
        document.getElementById("wisdom").innerText = quotes[Math.floor(Math.random() * quotes.length)];
    }

    function openMateri(title, desc) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('materi').style.display = 'block';
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
    }
    function backToHome() {
        document.getElementById('home').style.display = 'block';
        document.getElementById('materi').style.display = 'none';
    }
    const nomorWA = "628xxxxxxxxxx"; // GANTI NOMOR WA LU
    function hubungiMentor() {
        window.open("https://wa.me/" + nomorWA + "?text=Halo Rey, saya ingin diskusi materi " + document.getElementById('mTitle').innerText);
    }
</script>
</body>
</html>
