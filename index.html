<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy | Ultimate Dashboard</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; background: #000; overflow-x: hidden; }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: -1; }

        .container { max-width: 900px; margin: auto; padding: 40px 20px; }
        h1 { color: #58a6ff; text-align: center; font-size: 2.5em; text-shadow: 0 0 15px rgba(88, 166, 255, 0.5); margin-bottom: 30px; }

        /* Story Box (Typing Effect) */
        .story-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; text-align: center; }
        #typing-text { font-style: italic; line-height: 1.7; min-height: 80px; font-family: 'Courier New', monospace; color: #c9d1d9; }

        /* Grid Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .code-card { background: rgba(22, 27, 34, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(88, 166, 255, 0.3); padding: 25px; border-radius: 20px; cursor: pointer; transition: 0.4s; }
        .code-card:hover { border-color: #58a6ff; transform: translateY(-10px); box-shadow: 0 10px 30px rgba(88, 166, 255, 0.3); }

        /* Controls */
        .music-btn { position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 12px 20px; background: #58a6ff; border: none; border-radius: 20px; cursor: pointer; color: black; font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1001; justify-content: center; align-items: center; }
        .modal-content { background: #0d1117; padding: 40px; border-radius: 25px; max-width: 600px; width: 90%; border: 1px solid #58a6ff; }
        .btn-wa { background: #238636; color: white; padding: 15px; width: 100%; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="VID_20250702_110744_839.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<audio id="bg-audio" loop>
    <source src="Dfa993adbcb673c762296685dcf55592.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()" id="music-btn">🎵 Play Music</button>

<div class="container">
    <h1>> REY_CODE_ACADEMY</h1>

    <div class="story-box">
        <p id="typing-text"></p>
    </div>

    <div class="grid">
        <div class="code-card" onclick="openDetail('Web Development', '1. Konsep Dasar: Memahami arsitektur Client-Server dan protokol HTTP/HTTPS.\n2. Frontend: Menguasai HTML5, CSS3, dan JavaScript ES6+.\n3. Backend: Membangun API dengan Node.js/Python, serta manajemen database.\n4. Deployment: Proses publikasi web agar diakses publik.')"><h3>🚀 01. Web Dev</h3></div>
        
        <div class="code-card" onclick="openDetail('Mobile Development', '1. Native vs Cross-Platform: Swift/Kotlin vs Flutter/React Native.\n2. Hardware Access: Integrasi kamera, GPS, dan biometrik.\n3. State Management: Menangani data aplikasi agar performa tetap 60 FPS.\n4. Store Publishing: Panduan rilis ke Play Store dan App Store.')"><h3>📱 02. Mobile Dev</h3></div>

        <div class="code-card" onclick="openDetail('Data Science', '1. Data Wrangling: Pandas dan NumPy untuk pembersihan data.\n2. EDA: Visualisasi pola data dengan Matplotlib dan Seaborn.\n3. Machine Learning: Membangun model prediktif (Regresi/Klasifikasi) dengan Scikit-Learn.\n4. Business Impact: Mengubah angka menjadi keputusan strategis.')"><h3>📊 03. Data Science</h3></div>

        <div class="code-card" onclick="openDetail('Game Development', '1. Game Engine: Penguasaan Unity (C#) atau Unreal Engine (C++/Blueprints).\n2. Matematika 3D: Vektor, Matriks, dan Trigonometri untuk ruang virtual.\n3. Fisika & Collision: Simulasi gravitasi dan interaksi objek.\n4. AI & Gameplay: Behavior Trees untuk kecerdasan musuh.')"><h3>🎮 04. Game Dev</h3></div>

        <div class="code-card" onclick="openDetail('UI/UX Design', '1. Research & Strategy: User research, persona, dan journey mapping.\n2. Prototyping: Wireframing ke Hi-Fi di Figma.\n3. Visual Principles: Hierarki warna dan tipografi.\n4. Usability Testing: Iterasi desain berdasarkan feedback nyata.')"><h3>🎨 05. UI/UX</h3></div>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mTitle" style="color: #58a6ff;"></h2>
        <p id="mDesc" style="line-height: 1.8; white-space: pre-line;"></p>
        <button class="btn-wa" onclick="hubungiMentor()">Konsultasi dengan Mentor Rey</button>
        <button onclick="closeModal()" style="background:none; border:none; color:grey; margin-top:20px; width:100%; cursor:pointer;">Tutup</button>
    </div>
</div>

<script>
    // Typing Effect
    const text = "Dulu, gue pikir memperbaiki hati itu sama kayak memperbaiki bug. Ternyata cinta jauh lebih rumit daripada syntax. Gue memilih untuk fokus membangun masa depan melalui kode. Selamat datang di tempat di mana logika menang atas perasaan.";
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typing-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 30);
        }
    }
    window.onload = typeWriter;

    // Music
    function toggleMusic() {
        const audio = document.getElementById("bg-audio");
        const btn = document.getElementById("music-btn");
        if (audio.paused) { audio.play(); btn.innerText = "⏸ Pause Music"; }
        else { audio.pause(); btn.innerText = "🎵 Play Music"; }
    }

    // Modal
    function openDetail(title, desc) {
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
    function hubungiMentor() {
        window.open("https://wa.me/628xxxxxxxxxx?text=Halo Rey, saya ingin diskusi lebih lanjut tentang " + document.getElementById('mTitle').innerText);
    }
</script>
</body>
</html>
