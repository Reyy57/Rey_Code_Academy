<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Store - Digital Marketplace</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px;
            display: flex; justify-content: center; min-height: 100vh;
            background-image: url('554375.webp'); 
            background-size: cover; background-position: center; 
            background-attachment: fixed;
        }
        .container { 
            width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.95); 
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #222; margin-bottom: 20px; }
        .product { 
            background: #fff; padding: 15px; margin: 15px 0; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #eee; transition: 0.3s;
        }
        .product:hover { border-color: #4a90e2; }
        button { 
            background: #25d366; color: white; border: none; padding: 10px 15px; 
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Rey Store 🛒</h1>
    <p>Silakan pilih produk yang ingin dipesan:</p>
    
    <div class="product">
        <span>70 Diamond ML</span>
        <button onclick="order('70 Diamond ML')">Pesan</button>
    </div>
    
    <div class="product">
        <span>Akun FF Sultan</span>
        <button onclick="order('Akun FF Sultan')">Pesan</button>
    </div>
</div>

<script>
    function order(item) {
        // GANTI NOMOR DI BAWAH INI DENGAN NOMOR WA LU (PAKE 62)
        let hp = "6283136106128"; 
        let msg = "Halo Rey, saya mau beli: " + item;
        window.open("https://wa.me/" + hp + "?text=" + encodeURIComponent(msg));
    }
</script>
</body>
</html>
