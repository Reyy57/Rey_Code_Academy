<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Code Academy</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div id="login-form" class="space-y-4">
            <h2 class="text-2xl font-bold text-gray-800 text-center">Rey Code App</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-xl outline-blue-400">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-xl outline-blue-400">
            <button id="btn-login" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Login</button>
        </div>

        <div id="member-area" style="display: none;" class="space-y-4">
            <h2 class="text-lg font-bold">Halo, <span id="user-email" class="text-blue-600"></span></h2>
            
            <div id="list-container" class="space-y-2 max-h-60 overflow-y-auto p-2 bg-gray-50 rounded-lg">
                </div>

            <div id="admin-tools" class="hidden border-t pt-4">
                <input type="text" id="input-data" placeholder="Tambah catatan baru..." class="w-full p-2 border rounded-lg text-sm mb-2">
                <button id="btn-add" class="w-full bg-emerald-500 text-white py-2 rounded-lg text-sm">Tambah Data</button>
            </div>
            
            <button id="btn-logout" class="w-full bg-rose-500 text-white py-2 rounded-lg text-sm">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { /* ... isikan config lo ... */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Fungsi Tambah Data
        document.getElementById("btn-add").addEventListener("click", async () => {
            const val = document.getElementById("input-data").value;
            if(val) {
                await addDoc(collection(db, "catatan"), { teks: val, date: new Date() });
                document.getElementById("input-data").value = "";
            }
        });

        onAuthStateChanged(auth, async (user) => {
            document.getElementById("login-form").style.display = user ? "none" : "block";
            document.getElementById("member-area").style.display = user ? "block" : "none";
            
            if(user) {
                document.getElementById("user-email").innerText = user.email;
                if(user.email === "rey@gmail.com") document.getElementById("admin-tools").classList.remove("hidden");

                const q = query(collection(db, "catatan"), orderBy("date", "desc"));
                onSnapshot(q, (snapshot) => {
                    const list = document.getElementById("list-container");
                    list.innerHTML = "";
                    snapshot.forEach(doc => {
                        list.innerHTML += `<div class="p-2 bg-white rounded shadow-sm text-sm border">${doc.data().teks}</div>`;
                    });
                });
            }
        });
        document.getElementById("btn-login").onclick = () => signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
        document.getElementById("btn-logout").onclick = () => signOut(auth);
    </script>
</body>
</html>
