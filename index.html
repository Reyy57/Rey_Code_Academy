<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ProjectRey</title>
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
        window.GoogleGenerativeAI = GoogleGenerativeAI;
    </script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: url('554375.webp'); 
            background-size: cover; background-position: center; 
            background-attachment: fixed; background-repeat: no-repeat;
        }
        .container { 
            width: 100%; max-width: 700px; background: rgba(255, 255, 255, 0.9); 
            padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            backdrop-filter: blur(5px); 
        }
        h1 { color: #333; text-align: center; margin-bottom: 20px; }
        textarea, input { width: 100%; margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #4a90e2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        #output { margin-top: 20px; padding: 20px; border: 1px solid #eee; border-radius: 8px; background: rgba(250,250,250,0.9); min-height: 100px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ProjectRey AI</h1>
    <input type="password" id="apiKeyInput" placeholder="Masukkan API Key...">
    <textarea id="prompt" rows="5" placeholder="Tanya sesuatu ke AI..."></textarea>
    <button onclick="runAI()">Kirim ke AI</button>
    <div id="output">Hasil jawaban akan muncul di sini...</div>
</div>

<script>
    async function runAI() {
        const apiKey = document.getElementById("apiKeyInput").value;
        const prompt = document.getElementById("prompt").value;
        const output = document.getElementById("output");
        
        if (!apiKey) { alert("Masukkan API Key dulu!"); return; }
        if (!window.GoogleGenerativeAI) { alert("Library belum siap, tunggu sebentar ya!"); return; }
        
        output.innerText = "Sedang memproses...";

        try {
            const genAI = new window.GoogleGenerativeAI(apiKey);
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            const result = await model.generateContent(prompt);
            output.innerText = result.response.text();
        } catch (error) {
            output.innerText = "Error: " + error.message;
        }
    }
</script>
</body>
</html>
